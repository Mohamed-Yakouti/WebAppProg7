<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed El Yakouti reflexes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h1>Mohamed El Yakouti reflexes</h1>

    <div id="target" class="mb-2 fs-5">Your time</div>
    <div id="counter" class="mb-3 fs-5">Count</div>

    <button type="button" class="btn btn-primary me-2" onclick="beginTime()">Go</button>
    <button type="button" class="btn btn-danger" onclick="recordTime()">Halt</button>

    <script>
        let haltTime = undefined;

        function recordTime() {
            haltTime = Date.now();
            console.log("Halt time recorded:", haltTime);
        }

        function beginTime() {
            haltTime = undefined;
            document.getElementById("target").textContent = "Your time";

            // BONUS: Random starting count between 2 and 10
            let startCount = Math.floor(Math.random() * 9) + 2; 

            for (let i = startCount; i >= 0; i--) {
                setTimeout(() => {
                    document.getElementById("counter").textContent = i;
                }, (startCount - i) * 1000);
            }

            setTimeout(() => {
                if (haltTime === undefined) {
                    document.getElementById("target").textContent = "Not soon enough";
                } else {
                    let targetTime = Date.now();
                    let elapsedTime = targetTime - haltTime;
                    document.getElementById("target").textContent = "Time was " + elapsedTime + " ms";
                }
            }, startCount * 1000);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
