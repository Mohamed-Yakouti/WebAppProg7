<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed El Yakouti finds avians</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .game-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
        }
    </style>
</head>
<body class="p-4">

    <h1>Mohamed El Yakouti finds avians</h1>

    <p class="lead">Click on the locations to find the flowers, watch out for the poison ivy</p>
    <p id="locations">Number of locations checked is zero.</p>
    <p id="score">Score is zero.</p>
    <p id="help-button" style="cursor: pointer;" onclick="help()">Click for help.</p>
    <p id="help">Help report</p>

    <div class="container my-3">
        <!-- 6x6 Grid (0 to 35) -->
        <script>
            for (let r = 0; r < 6; r++) {
                document.write('<div class="row g-1 mb-1">');
                for (let c = 0; c < 6; c++) {
                    let idx = r * 6 + c;
                    document.write('<div class="col-auto"><img id="plant-' + idx + '" src="bush.jpg" class="game-img border" alt="bush" onclick="check(' + idx + ')"></div>');
                }
                document.write('</div>');
            }
        </script>
    </div>

    <script>
        const ids = Array.from({length: 36}, (_, i) => "plant-" + i);

        let score = 0;
        let locationsVisited = 0;
        let lastLocation = 0;
        let gameOver = false;

        // BONUS: Generate unique random positions (0 to 35)
        function getRandomPositions(count) {
            let positions = new Set();
            while (positions.size < count) {
                positions.add(Math.floor(Math.random() * 36));
            }
            return Array.from(positions);
        }

        let randoms = getRandomPositions(9);
        let poisonLocation = randoms[0];
        let roseLocation = randoms[1];
        let lilyLocations = [randoms[2], randoms[3]];
        let daisyLocations = [randoms[4], randoms[5], randoms[6], randoms[7], randoms[8]];

        function check(position) {
            if (gameOver) return;

            let imgId = ids[position];
            let imgElement = document.getElementById(imgId);

            if (position === poisonLocation) {
                imgElement.src = "ivy.jpg";
                gameOver = true;
                score -= 4;
            } else if (position === roseLocation) {
                imgElement.src = "rose.jpg";
                score += 4;
            } else if (lilyLocations.includes(position)) {
                imgElement.src = "lily.jpg";
                score += 2;
            } else if (daisyLocations.includes(position)) {
                imgElement.src = "daisy.jpg";
                score += 1;
            } else {
                imgElement.src = "ivy.jpg";
            }

            imgElement.onclick = null;
            locationsVisited++;
            lastLocation = position;

            // BONUS: Move rose randomly North, South, East, West
            if (!gameOver) {
                moveRose(position);
            }

            document.getElementById("locations").textContent = "Number of locations checked is " + locationsVisited + ".";
            document.getElementById("score").textContent = "Score is " + score + ".";
        }

        function moveRose(playerPos) {
            let row = Math.floor(roseLocation / 6);
            let col = roseLocation % 6;
            let validMoves = [];

            if (row > 0) validMoves.push(roseLocation - 6); // North
            if (row < 5) validMoves.push(roseLocation + 6); // South
            if (col > 0) validMoves.push(roseLocation - 1); // West
            if (col < 5) validMoves.push(roseLocation + 1); // East

            let nextRoseLocation = validMoves[Math.floor(Math.random() * validMoves.length)];
            roseLocation = nextRoseLocation;

            // If rose lands on player location, game over
            if (roseLocation === playerPos) {
                gameOver = true;
                alert("The rose moved onto your location! Game Over.");
            }
        }

        function help() {
            let row = Math.floor(lastLocation / 6);
            let col = lastLocation % 6;

            let up = (lastLocation - 6 + 36) % 36;
            let down = (lastLocation + 6) % 36;
            let left = col === 0 ? lastLocation + 5 : lastLocation - 1;
            let right = col === 5 ? lastLocation - 5 : lastLocation + 1;

            let neighbors4 = [up, down, left, right];

            for (let loc of neighbors4) {
                if (daisyLocations.includes(loc)) {
                    document.getElementById("help").textContent = "cold";
                    return "cold";
                }
            }

            let neighbors9 = [];
            for (let r = Math.max(0, row - 1); r <= Math.min(5, row + 1); r++) {
                for (let c = Math.max(0, col - 1); c <= Math.min(5, col + 1); c++) {
                    neighbors9.push(r * 6 + c);
                }
            }

            if (neighbors9.includes(roseLocation)) {
                document.getElementById("help").textContent = "hot";
                return "hot";
            }

            if (neighbors9.includes(poisonLocation)) {
                document.getElementById("help").textContent = "watch out";
                return "watch out";
            }

            document.getElementById("help").textContent = "warm";
            return "warm";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
