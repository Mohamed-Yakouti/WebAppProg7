<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed El Yakouti builds list with divs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            min-height: 80px;
        }
        .divlist {
            background-color: #0d6efd;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body class="p-4">

    <h1>Mohamed El Yakouti builds list with divs</h1>

    <div class="mb-3 col-md-4">
        <label for="inputText" class="form-label">Enter Text:</label>
        <input type="text" id="inputText" class="form-control" placeholder="Type something...">
    </div>

    <div class="mb-3">
        <button type="button" class="btn btn-success me-2" onclick="addEnd()">Add end</button>
        <button type="button" class="btn btn-primary me-2" onclick="addFront()">Add front</button>
        <button type="button" class="btn btn-danger me-2" onclick="removeEveryOther()">Remove</button>
        <!-- BONUS: Shuffle button -->
        <button type="button" class="btn btn-warning" onclick="shuffle()">Shuffle</button>
    </div>

    <div id="container" class="flex-container">
        <div class="divlist">row item 1</div>
        <div class="divlist">row item 2</div>
        <div class="divlist">row item 3</div>
    </div>

    <script>
        function addEnd() {
            let inputVal = document.getElementById("inputText").value;
            if (!inputVal) inputVal = "New Item";

            let container = document.getElementById("container");
            let newDiv = document.createElement("div");
            newDiv.innerHTML = inputVal;
            newDiv.className = "divlist";

            container.appendChild(newDiv);
        }

        function addFront() {
            let inputVal = document.getElementById("inputText").value;
            if (!inputVal) inputVal = "New Item";

            let container = document.getElementById("container");
            let newDiv = document.createElement("div");
            newDiv.innerHTML = inputVal;
            newDiv.className = "divlist";

            container.insertBefore(newDiv, container.firstChild);
        }

        function removeEveryOther() {
            let divListItems = document.getElementsByClassName("divlist");
            let length = divListItems.length;

            for (let i = length - 1; i >= 0; i--) {
                if (i % 2 === 0) {
                    divListItems[i].remove();
                }
            }
        }

        // BONUS: Randomly select two elements and swap them
        function shuffle() {
            let divListItems = document.getElementsByClassName("divlist");
            if (divListItems.length < 2) return;

            let idx1 = Math.floor(Math.random() * divListItems.length);
            let idx2 = Math.floor(Math.random() * divListItems.length);

            while (idx1 === idx2) {
                idx2 = Math.floor(Math.random() * divListItems.length);
            }

            let container = document.getElementById("container");
            let item1 = divListItems[idx1];
            let item2 = divListItems[idx2];

            let tempText = item1.innerHTML;
            item1.innerHTML = item2.innerHTML;
            item2.innerHTML = tempText;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
